name: Bug 报告
description: 报告可复现的问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请删除所有 token、webhook、数据库内容和其他敏感信息后再提交。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？期望行为是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: trend-sift 与 Python 版本
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 运行方式
      options: [uv, Docker Compose]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      render: shell
