name: trend-sift

services:
  web:
    build: .
    image: trend-sift:local
    env_file: .env
    environment:
      SCHEDULE_ENABLED: ${SCHEDULE_ENABLED:-true}
      TREND_SIFT_DB_PATH: /var/lib/trend-sift/trending.db
      TREND_SIFT_LOG_DIR: /var/log/trend-sift
    ports:
      - "${TREND_SIFT_BIND:-127.0.0.1}:${TREND_SIFT_PORT:-8111}:8000"
    volumes:
      - ./data:/var/lib/trend-sift
      - ./logs:/var/log/trend-sift
    init: true
    restart: unless-stopped
